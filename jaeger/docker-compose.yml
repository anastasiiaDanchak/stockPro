version: "3.8"

services:
  jaeger:
    image: jaegertracing/all-in-one:1.48
    container_name: jaeger
    ports:
      - "16686:16686"  # веб-інтерфейс Jaeger
      - "6831:6831/udp" # для UDP трейсів
      - "14268:14268"  # HTTP endpoint для прийому трейсів
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
